<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLYP Recording Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .recording-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
            z-index: 10000;
            animation: pulse 2s infinite;
        }
        
        .recording-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        
        .vlyp-score {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(59, 130, 246, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            z-index: 10000;
        }
        
        .highlight-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.3) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 9999;
        }
        
        .highlight-flash.active {
            animation: highlightPulse 0.8s ease-out;
        }
        
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            z-index: 10000;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @keyframes highlightPulse {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="recording-indicator">
        <div class="recording-dot"></div>
        <span>REC</span>
    </div>
    
    <div class="vlyp-score">
        VLYP Score: <span id="score-value">0</span>
    </div>
    
    <div class="highlight-flash" id="highlight-flash"></div>
    
    <div class="controls-hint">
        Ctrl+Shift+H to Highlight • Ctrl+Shift+R to Stop
    </div>
    
    <script>
        const { ipcRenderer } = require('electron');
        
        let currentScore = 0;
        
        // Update VLYP score display
        ipcRenderer.on('vlyp-score-update', (event, { score, timestamp }) => {
            currentScore = Math.round(score);
            document.getElementById('score-value').textContent = currentScore;
            
            // Auto-highlight on high scores
            if (score > 85) {
                flashHighlight();
            }
        });
        
        // Handle manual highlight
        ipcRenderer.on('highlight-moment', (event, { timestamp }) => {
            flashHighlight();
        });
        
        function flashHighlight() {
            const flash = document.getElementById('highlight-flash');
            flash.classList.add('active');
            
            setTimeout(() => {
                flash.classList.remove('active');
            }, 800);
        }
        
        // Update time
        setInterval(() => {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            // Could add time display if needed
        }, 1000);
    </script>
</body>
</html>
