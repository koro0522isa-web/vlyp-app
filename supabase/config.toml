# Supabase local dev config
# See https://supabase.com/docs/guides/local-development

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge Function: publish-scheduled
# Cron: every 5 minutes — set in Supabase Dashboard > Edge Functions > Schedule
# Deploy: supabase functions deploy publish-scheduled --project-ref hpozodliggxykeroudtx
[functions.publish-scheduled]
verify_jwt = false
