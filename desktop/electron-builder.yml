appId: "com.vlyp.clips"
productName: "VLYP Clips"
directories:
  buildResources: assets
  output: dist

files:
  - from: dist/main
    to: main
    filter:
      - "**/*"
  - from: dist/renderer
    to: renderer
    filter:
      - "**/*"
  - node_modules/**/*

win:
  target:
    - nsis
    - portable
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "VLYP Clips"
