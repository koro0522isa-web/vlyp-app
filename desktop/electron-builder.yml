appId: "com.vlyp.clips"
productName: "VLYP Clips"
directories:
  buildResources: assets
  output: dist

files:
  - "dist/**/*"
  - "node_modules/**/*"
  - "package.json"

# Extract native binaries (FFmpeg) outside the asar archive
# so they remain executable at runtime.
asarUnpack:
  - "node_modules/ffmpeg-static/**"

win:
  target:
    - nsis
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "VLYP Clips"
